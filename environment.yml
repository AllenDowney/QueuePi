# Development environment for QueuePi.
# Python 3.13 matches the Pi (Raspberry Pi OS Lite 64-bit, Debian 13 trixie,
# ships 3.13), so the laptop runs the same version as the shop.
name: QueuePi
channels:
  - conda-forge
dependencies:
  - python=3.13
  - fastapi
  - uvicorn
  - pygame
  - segno          # QR code on the display
  - pytest
  - httpx          # FastAPI TestClient
  - pip
  - pip:
      - -e .
